// ================= WORLD BOUNDS (a diorama block) =================

// ================= TERRAIN =================
const PEAKS = [[-26, -10, 15, 7], [-17, -16, 10, 6], [-34, 0, 11, 6], [-12, -14, 6, 5], [-24, 6, 5, 4]];
function landDist(x, z) {

  return Math.sqrt(m);
}

{
  const geo = new THREE.PlaneGeometry(X1 - X0, ZC - Z0, 184, 100); geo.rotateX(-Math.PI / 2); geo.translate((X0 + X1) / 2, 0, (Z0 + ZC) / 2);
  const pos = geo.attributes.position, cols = new Float32Array(pos.count * 3), c = new THREE.Color();
  const sand = new THREE.Color('#ffd98a'), grass = new THREE.Color('#7ddc5a'), grass2 = new THREE.Color('#3fbf5e'),

    else if (h < 0.15) c.copy(deep);

// ================= LAKE =================
{

  uniforms: riverU, transparent: true,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,

STAGES.forEach((s, i) => {
  const b = document.createElement('div'); b.className = 'st'; b.setAttribute('role', 'button'); b.tabIndex = 0;
  b.style.setProperty('--c', s.color); b.style.setProperty('--tint', s.color + '14');
  b.innerHTML = `<div class="head"><span class="n" style="background:${s.color}">${i + 1}</span><span class="name">${s.name}</span><span class="em">${s.emoji}</span></div>`
    + (s.sub ? `<div class="sub body">(${s.sub})</div>` : '')
    + `<div class="body"><p class="txt">${s.text}</p><p class="fact">${s.fact}</p></div><span class="bar" style="background:${s.color}"></span>`;
  b.onclick = () => { track('Ciclo del agua: fase', { fase: s.name }); cycleT = starts[i] + 0.001; setGuided(true); if (!started) document.getElementById('go').click(); else if (paused) togglePause(); };
  b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.onclick(); } };
  stepsEl.appendChild(b); stepBtns.push(b);
});
let shown = -1;
function showStage(i) {
  if (i === shown) return; shown = i;
  stepBtns.forEach((b, k) => b.classList.toggle('on', k === i));
}
let paused = true, started = false, guided = true, cycleT = 0, textOn = true;
const pauseBtn = document.getElementById('pause'), camBtn = document.getElementById('cam'), txtBtn = document.getElementById('txtBtn');
function togglePause() { paused = !paused; pauseBtn.textContent = paused ? '▶ Seguir' : '⏸ Pausa'; }
function setGuided(v) { guided = v; camBtn.setAttribute('aria-pressed', v); }
pauseBtn.onclick = () => { if (started) togglePause(); };
camBtn.onclick = () => setGuided(!guided);
txtBtn.onclick = () => { textOn = !textOn; stepsEl.classList.toggle('hidden', !textOn); txtBtn.textContent = textOn ? '📖 Ocultar texto' : '📖 Mostrar texto'; };
controls.addEventListener('start', () => { if (started) setGuided(false); });
// ================= MUSIC (an original, cheerful marimba tune made with Web Audio) =================
const Music = (() => {
  let ctx = null, master = null, verb = null, noise = null, timer = null, step = 0, next = 0, on = false;
  const BPM = 112, E = 60 / BPM / 2; // eighth note
  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const hz = n => 440 * Math.pow(2, (12 * (+n[1] + 1) + SEMI[n[0]] - 69) / 12);
  const _ = null;
  const MEL = [
    'C5','C5','E5','G5','A5','G5','E5',_,    'D5','D5','G5',_,'B4',_,'D5',_,
    'E5','E5','A5','G5','E5',_,'C5',_,      'F5','E5','D5','C5','A4',_,_,_,
    'G5','E5','G5','E5','C6',_,'G5',_,      'D5','G5','B5','G5','D5',_,'B4',_,
    'A5','G5','F5','A5','G5','F5','E5','D5', 'D5',_,'E5',_,'D5','B4','G4',_ ];
  const BARS = [ ['C3','G3',['C4','E4','G4']], ['G2','D3',['B3','D4','G4']], ['A2','E3',['A3','C4','E4']], ['F2','C3',['A3','C4','F4']],
                 ['C3','G3',['C4','E4','G4']], ['G2','D3',['B3','D4','G4']], ['F2','C3',['A3','C4','F4']], ['G2','D3',['B3','D4','G4']] ];
  function env(gn, t, v, a, d) { gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(v, t + a); gn.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
  function osc(type, freq, t, v, a, d, wet = true) {
    const o = ctx.createOscillator(), gn = ctx.createGain(); o.type = type; o.frequency.value = freq;
    env(gn, t, v, a, d); o.connect(gn); gn.connect(master); if (wet) gn.connect(verb); o.start(t); o.stop(t + a + d + .05);
    return o;
  }
  function marimba(n, t, v) { const f = hz(n); osc('sine', f, t, v, .004, .42); osc('sine', f * 4, t, v * .22, .002, .08); osc('triangle', f * 2, t, v * .12, .003, .15); }
  function bass(n, t) { osc('triangle', hz(n), t, .2, .006, .26, false); osc('sine', hz(n), t, .12, .006, .3, false); }
  function stab(ch, t) { ch.forEach(n => osc('triangle', hz(n), t, .028, .004, .13)); }
  function kick(t) {
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(48, t + .14);
    env(gn, t, .3, .003, .16); o.connect(gn); gn.connect(master); o.start(t); o.stop(t + .2);
  }
  function hit(t, v, type, freq, d) {
    const src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), gn = ctx.createGain();
    src.buffer = noise; fl.type = type; fl.frequency.value = freq; env(gn, t, v, .002, d);
    src.connect(fl); fl.connect(gn); gn.connect(master); src.start(t, Math.random() * .5); src.stop(t + d + .05);
  }
  function schedule() {
    while (next < ctx.currentTime + .3) {
      const i = step % MEL.length, b = BARS[Math.floor(i / 8)], e = i % 8, loop = Math.floor(step / MEL.length);
      if (e % 2 === 0) bass(e % 4 === 0 ? b[0] : b[1], next); else stab(b[2], next);
      if (e === 0 || e === 4) kick(next);
      if (e === 2 || e === 6) hit(next, .07, 'bandpass', 1900, .1);
      hit(next, e % 2 ? .035 : .018, 'highpass', 7000, .045);
      if (MEL[i] && !(loop % 4 === 3 && i >= 32)) marimba(MEL[i], next, .2);
      if (loop % 2 === 1 && MEL[i] && e % 2 === 0) marimba(MEL[i], next + E * .5, .06); // little echo on every 2nd round
      next += E; step++;
    }
  }
  function start() {
    try {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6500;
        master = ctx.createGain(); master.gain.value = 0; master.connect(lp); lp.connect(ctx.destination);
        const len = ctx.sampleRate * 1.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / len, 3); }
        verb = ctx.createConvolver(); verb.buffer = ir; const vg = ctx.createGain(); vg.gain.value = .18; verb.connect(vg); vg.connect(lp);
        noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const nd = noise.getChannelData(0); for (let k = 0; k < nd.length; k++) nd[k] = Math.random() * 2 - 1;
      }
      ctx.resume();
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(.5, ctx.currentTime, .4);
      if (!timer) { step = 0; next = ctx.currentTime + .1; timer = setInterval(schedule, 60); }
      on = true;
    } catch (e) { on = false; }
    return on;
  }
  function stop() {
    if (!ctx) return; on = false;
    master.gain.setTargetAtTime(0, ctx.currentTime, .2);
    setTimeout(() => { if (!on) { clearInterval(timer); timer = null; } }, 1200);
  }
  return { start, stop, get on() { return on; } };
})();
const musicBtn = document.getElementById('music');
function setMusicBtn() { musicBtn.setAttribute('aria-pressed', Music.on); musicBtn.textContent = Music.on ? '🎵 Música' : '🔇 Música'; }
musicBtn.onclick = () => { Music.on ? Music.stop() : Music.start(); setMusicBtn(); track('Ciclo del agua: música', { estado: Music.on ? 'encendida' : 'apagada' }); };
setMusicBtn();

document.getElementById('go').onclick = () => { track('Ciclo del agua: empieza'); Music.start(); setMusicBtn(); started = true; paused = false; pauseBtn.textContent = '⏸ Pausa'; document.getElementById('intro').classList.add('gone'); };
showStage(0);

// shift the scene so its centre sits in the free space beside the panel
let viewOff = 0, lastW = 0, lastH = 0;
function layout() {
  if (innerWidth !== lastW || innerHeight !== lastH) { lastW = innerWidth; lastH = innerHeight; renderer.setSize(innerWidth, innerHeight); }
  const wide = innerWidth > 760;
  const target = wide && textOn ? Math.min(stepsEl.getBoundingClientRect().right + 16, innerWidth * .45) : 0;
  viewOff += (target - viewOff) * 0.15;
  if (Math.abs(viewOff) > 0.5) camera.setViewOffset(innerWidth + viewOff, innerHeight, 0, 0, innerWidth, innerHeight);
  else camera.clearViewOffset();
  camera.aspect = (innerWidth + viewOff) / innerHeight;
  camera.updateProjectionMatrix();
}


// ================= LOOP =================
const clock = new THREE.Clock();
const SEA_P = new THREE.Vector3(13, 0.7, 13);
const LAKE_FRONT = new THREE.Vector3(LAKE.x + 0.4, LAKE.y + 0.75, LAKE.z + 1.4);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function along(pts, ts, p) { for (let i = 1; i < ts.length; i++) if (p <= ts[i] || i === ts.length - 1) { const k = easeIO(clamp01((p - ts[i - 1]) / (ts[i] - ts[i - 1]))); return pts[i - 1].clone().lerp(pts[i], k); } }
const white = new THREE.Color(0xffffff), grey = new THREE.Color(0x8e9bb5);
const camGoalP = new THREE.Vector3(), camGoalT = new THREE.Vector3();
let fishClock = 0;

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (!paused) cycleT += dt;
  const { i: st, p } = stageAt(cycleT);
  if (started) showStage(st);
  stepBtns.forEach((b, k) => b.querySelector('.bar').style.width = (k === st && started ? p * 100 : 0) + '%');

  // intensities
  const evapI = st === 0 ? sstep(0, .15, p) : st === 1 ? 1 - sstep(0, .6, p) : 0.12;
  const rainI = st === 2 ? sstep(.05, .25, p) * (1 - sstep(.88, 1, p)) : 0;
  const flowI = st === 3 ? 1 : st === 2 ? p * .6 : .35;
  const infI = st === 4 ? 1 : st === 3 ? .4 : st === 2 ? .5 * p : .12;
  const rbI = st === 3 ? sstep(0, .2, p) * (1 - sstep(.75, 1, p)) : 0;

  // cloud
  let cpos = new THREE.Vector3(), cs = 1, greyK = 0;
  if (st === 0) { cpos.copy(C_SEA); cs = .4 + .25 * p; }
  else if (st === 1) { cpos.lerpVectors(C_SEA, C_MOUNT, easeIO(sstep(.25, 1, p))); cs = .65 + .6 * sstep(0, .6, p); greyK = sstep(.6, 1, p) * .6; }
  else if (st === 2) { cpos.copy(C_MOUNT); cs = 1.25 - .45 * sstep(.4, 1, p); greyK = .6 + .4 * (1 - sstep(.7, 1, p)); }
  else if (st === 3) { cpos.lerpVectors(C_MOUNT, C_SEA, easeIO(p)); cs = .8 - .4 * p; }
  else { cpos.copy(C_SEA); cs = .4; }
  cpos.y += Math.sin(t * 1.2) * .3;
  cloud.position.copy(cpos); cloud.scale.setScalar(cs);
  mainCloudMat.color.copy(white).lerp(grey, greyK);
  cloud.lookAt(camera.position.x, cloud.position.y, camera.position.z);
  skyU.uGrey.value += ((st === 2 ? 1 : 0) - skyU.uGrey.value) * dt * 1.5;
  hemi.intensity = 1.5 - .35 * skyU.uGrey.value;

  // gotita (and, after the lake, her twin)
  let g = new THREE.Vector3(), op = 1, s1 = 1.9, s2 = 0, g2 = null;
  const AQ = (AQT + AQB) / 2, side = V(.9, 0, 0);
  if (st === 0) {
    const k = easeIO(sstep(.08, 1, p)); g.lerpVectors(SEA_P, cpos.clone().add(V(0, -1.2, 1.5)), k);
    g.x += Math.sin(t * 3) * .6 * k; g.y += Math.sin(t * 5) * .1; op = 1 - .55 * Math.sin(k * Math.PI);
  } else if (st === 1) { g.copy(cpos).add(V(0, -1.9 * cs, 2.0 * cs)); g.y += Math.sin(t * 4) * .15; }
  else if (st === 2) {
    const top = cpos.clone().add(V(0, -2 * cs, 1.5 * cs)), land = onRiver(UP, 0).add(V(0, .9, 0));
    const k = sstep(.2, .7, p); g.lerpVectors(top, land, k * k); if (k >= 1) g.y += Math.abs(Math.sin(t * 6)) * .25 * (1 - sstep(.7, 1, p));
  } else if (st === 3) {
    if (p < .5) { g.copy(onRiver(UP, sstep(0, .5, p))).add(V(0, .9, 0)); g.y += Math.abs(Math.sin(t * 7)) * .2; }
    else if (p < .65) g.copy(onRiver(UP, 1)).add(V(0, .75, 0)).lerp(LAKE_FRONT, easeIO(sstep(.5, .65, p)));
    else {
      // split into two!
      const k = sstep(.65, .8, p), pop = k + Math.sin(k * Math.PI) * .35;
      g.copy(LAKE_FRONT).addScaledVector(side, -k); g2 = LAKE_FRONT.clone().addScaledVector(side, k);
      s1 = 1.9 - .5 * k; s2 = 1.4 * pop;
      const w = Math.sin(t * 4) * .08; g.y += w; g2.y -= w;
    }
  } else {
    // drop 1: lower river to the sea
    const A0 = LAKE_FRONT.clone().sub(side), SEA_A = SEA_P.clone().add(V(-2, 0, -1.5));
    if (p < .08) g.lerpVectors(A0, onRiver(LO, .08).add(V(0, .8, 0)), easeIO(p / .08));
    else if (p < .45) { g.copy(onRiver(LO, .08 + .92 * sstep(.08, .45, p))).add(V(0, .8, 0)); g.y += Math.abs(Math.sin(t * 7)) * .2; }
    else if (p < .55) g.lerpVectors(onRiver(LO, 1).add(V(0, .8, 0)), SEA_A, easeIO(sstep(.45, .55, p)));
    else if (p < .88) { g.copy(SEA_A); g.y += Math.sin(t * 2.5) * .25; }
    else g.lerpVectors(SEA_A, SEA_P, easeIO(sstep(.88, .92, p)));
    // drop 2: through the ground
    g2 = along([LAKE_FRONT.clone().add(side), V(LAKE.x + .6, LAKE.y - 1.4, ZC + .6), V(LAKE.x + 1.6, AQ, ZC + .6), V(-2, AQ, ZC + .6), V(8, AQ + .4, ZC + .6), V(12, .2, ZC + .3), SEA_P],
      [0, .1, .22, .5, .72, .85, .92], Math.min(p, .92));
    if (p > .22 && p < .72) g2.y += Math.sin(t * 5) * .12;
    // ...and they join again in the sea
    const k = sstep(.92, 1, p);
    s1 = 1.4 + .5 * k + Math.sin(k * Math.PI) * .3; s2 = 1.4 * (1 - k);
  }
  if (!started) { g.copy(SEA_P); g.y += Math.sin(t * 2) * .25; }
  gota.position.lerp(g, 1 - Math.exp(-dt * 10));
  gotaMat.opacity = op; gota.scale.setScalar(s1);
  gota.lookAt(camera.position.x, gota.position.y, camera.position.z);
  gota.rotateZ(Math.sin(t * 3) * .12);
  if (g2 && s2 > .02) {
    if (!gota2.visible) gota2.position.copy(g2);
    gota2.visible = true; gota2.position.lerp(g2, 1 - Math.exp(-dt * 10)); gota2.scale.setScalar(s2);
    gota2.lookAt(camera.position.x, gota2.position.y, camera.position.z); gota2.rotateZ(-Math.sin(t * 3) * .12);
  } else gota2.visible = false;

  // sun
  sun.lookAt(camera.position);
  sun.userData.rays.rotation.z += dt * (.2 + evapI * .8);
  const sp = 1 + (st === 0 ? .12 * Math.sin(t * 4) * evapI : 0);
  sun.scale.setScalar(sp);
  sun.userData.glow.material.opacity = .7 + .3 * evapI;

  // sea waves
  { const a = seaGeo.attributes.position, b = seaBase;
    for (let i = 0; i < a.count; i++) { const x = b[i * 3], z = b[i * 3 + 2]; a.setY(i, (Math.sin(x * .25 + t * 1.4) * .18 + Math.cos(z * .3 + t * 1.1) * .15) * seaEdge[i]); }
    a.needsUpdate = true; }

  // vapor
  { const P = vGeo.attributes.position.array, Cc = vGeo.attributes.color.array;
    for (let i = 0; i < VN; i++) {
      P[i * 3 + 1] += dt * (1.2 + 2.2 * evapI);
      P[i * 3] += Math.sin(t * 2 + vPh[i]) * dt * .6;
      if (P[i * 3 + 1] > 13) seaSpot(P, i, false);
      const y = P[i * 3 + 1], f = sstep(0, 2, y) * (1 - sstep(8, 13, y)) * (.15 + .85 * evapI) * .8;
      Cc[i * 3] = .75 * f; Cc[i * 3 + 1] = .9 * f; Cc[i * 3 + 2] = 1 * f;
    }
    vGeo.attributes.position.needsUpdate = true; vGeo.attributes.color.needsUpdate = true; }

  // rain
  for (let i = 0; i < RN; i++) {
    if (ralive[i]) {
      ry[i] -= dt * 16;
      if (ry[i] < rg[i]) ralive[i] = 0;
    }
    if (!ralive[i] && rnd() < rainI * .12) {
      const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * 4 * cs;
      rx[i] = cpos.x + Math.cos(a) * r; rz[i] = cpos.z + Math.sin(a) * r * .7; ry[i] = cpos.y - 1 + rr(-.5, .5);
      rg[i] = Math.max(H(rx[i], rz[i]), 0); ralive[i] = 1;
    }
    dummy.position.set(rx[i], ry[i], rz[i]); dummy.scale.setScalar(ralive[i] ? 1 : 0); dummy.updateMatrix(); rain.setMatrixAt(i, dummy.matrix);
  }
  rain.instanceMatrix.needsUpdate = true;

  // river, rainbow, arrows
  wallU.uT.value = t; wallU.uInf.value += (infI - wallU.uInf.value) * dt * 2;
  riverU.uT.value = t; riverU.uI.value += (flowI - riverU.uI.value) * dt * 2;
  rbMats.forEach(m => m.opacity = rbI * .95);
  arrows.forEach((a, k) => {
    const on = started && k === st;
    a.u.uT.value = t;
    a.u.uOp.value += ((on ? .95 : .28) - a.u.uOp.value) * dt * 4;
    a.headM.opacity = a.u.uOp.value;
    numEls[k]._scale = on ? 1.25 + Math.sin(t * 5) * .08 : 1;
  });

  // deco clouds, boat, fish
  deco.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 80) c.position.x = -80; c.lookAt(camera.position.x, c.position.y, camera.position.z); });
  { const a = t * .08; boat.position.set(28 + Math.cos(a) * 8, Math.sin(t * 1.6) * .15, 8 + Math.sin(a) * 6); boat.rotation.y = -a; boat.rotation.z = Math.sin(t * 1.3) * .06; }
  fishClock += dt;
  fishes.forEach(f => {
    const d = f.userData, T = 4.4, local = (fishClock + d.t0) % T, n = Math.floor((fishClock + d.t0) / T);
    if (n !== d.n) { d.n = n; d.x = rr(14, 32); d.z = rr(-4, 13); d.dir = rr(0, 6.28); }
    const jp = local / 1.1;
    if (jp <= 1 && d.dir !== undefined) {
      f.visible = true;
      f.position.set(d.x + Math.cos(d.dir) * (jp - .5) * 3, Math.sin(jp * Math.PI) * 2.2 - .2, d.z + Math.sin(d.dir) * (jp - .5) * 3);
      f.rotation.set(0, -d.dir, Math.cos(jp * Math.PI) * .9);
    } else f.visible = false;
  });

  { const a = t * .3; duck.position.set(LAKE.x + Math.cos(a) * 1.8, LAKE.y + .12 + Math.sin(t * 2) * .04, LAKE.z - .6 + Math.sin(a) * 1.4); duck.rotation.y = -a - Math.PI / 2; }

  // camera
  if (!started) { const a = t * .05; camGoalP.set(10 + Math.sin(a) * 12, 34, 62); camGoalT.set(-3, 5, 0); }
  else if (st === 4 && p > .78) { camGoalP.set(20, 10, 42); camGoalT.set(11, .5, 11); }
  else { const v = STAGES[st].view; camGoalP.set(...v.pos); camGoalT.set(...v.tgt); }
  if (guided || !started) {
    const k = 1 - Math.exp(-dt * 1.1);
    camera.position.lerp(camGoalP, k); controls.target.lerp(camGoalT, k);
  }
  layout();
  controls.update();
  renderer.render(scene, camera);
  updateLabels();
  requestAnimationFrame(tick);
}
